<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin - Reminder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'reminder-dark': '#111111', 'reminder-card': '#1A1A1A', 'reminder-neon': '#D3FF24', 'reminder-gray': '#A0A0A0' }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body {
            background-color: #111111;
            color: white;
        }
    </style>
</head>

<body class="antialiased p-6 md:p-12">
    <header class="mb-10 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-extrabold uppercase text-reminder-neon tracking-tight">Gestión de Clientes (B2B)
            </h1>
            <p class="text-reminder-gray">Añade y elimina barberías del sistema Reminder.</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-reminder-neon text-black font-extrabold flex items-center justify-center rounded">R
            </div>
            <span class="font-extrabold text-xl">reminder</span>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Formulario para añadir -->
        <div class="bg-reminder-card p-6 rounded-3xl border border-neutral-800 h-fit">
            <h2 class="text-xl font-bold mb-4 uppercase">Añadir Local</h2>
            <form id="form-local" class="flex flex-col gap-4">
    <div>
        <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">Nombre de la Barbería</label>
        <input type="text" id="nombre-local" required class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800 focus:outline-none focus:border-reminder-neon">
    </div>
    <div>
        <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">URL del Logo (Opcional)</label>
        <input type="url" id="logo-local" placeholder="https://ejemplo.com/logo.png" class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800 focus:outline-none focus:border-reminder-neon">
    </div>
    <div>
        <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">Sellos para corte gratis</label>
        <input type="number" id="max-sellos" value="10" required class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800 focus:outline-none focus:border-reminder-neon">
    </div>
    <button type="submit" id="btn-crear" class="w-full bg-reminder-neon text-black font-extrabold uppercase py-3 rounded-xl hover:bg-yellow-400 mt-2 transition-colors">
        Crear Barbería
    </button>
</form>
        </div>

        <!-- Listado de Locales -->
        <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 uppercase">Barberías Activas</h2>
            <div id="grid-locales" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-reminder-gray text-sm animate-pulse">Cargando locales...</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>

    <!-- Modal de Edición -->
<div id="modal-editar" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-reminder-card p-6 rounded-3xl border border-neutral-800 w-full max-w-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold uppercase">Editar Local</h2>
            <button id="btn-cerrar-modal" class="text-reminder-gray hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form id="form-editar" class="flex flex-col gap-4">
            <input type="hidden" id="edit-id">
            <div>
                <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">Nombre</label>
                <input type="text" id="edit-nombre" required class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800">
            </div>
            <div>
                <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">Sellos Máximos</label>
                <input type="number" id="edit-sellos" required class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800">
            </div>
            <div>
                <label class="text-xs text-reminder-gray uppercase font-semibold mb-1 block">URL del Logo</label>
                <input type="url" id="edit-logo" class="w-full bg-[#111111] text-white px-4 py-3 rounded-xl border border-neutral-800">
            </div>
            <button type="submit" class="w-full bg-white text-black font-extrabold uppercase py-3 rounded-xl hover:bg-neutral-200 mt-2">
                Guardar Cambios
            </button>
        </form>
    </div>
</div>

</body>

</html>
